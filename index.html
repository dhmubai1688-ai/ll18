<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>图片编辑</title>
    <link rel="icon" href="https://raw.githubusercontent.com/dh1888/dh18/main/ico/DHPG.png" type="image/x-icon" />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: "Rajdhani", sans-serif;
            padding: 5px;
        }

        .header {
            width: 100%;
            max-width: 1500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 0;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .header h1 {
            color: #ffd978;
            font-size: 24px;
            font-weight: 700;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-actions .btn {
            padding: 4px 12px;
            font-size: 13px;
        }

        .container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            max-width: 1500px;
            width: 100%;
        }

        .canvas-wrapper {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            flex-shrink: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            flex: 1;
            min-width: 300px;
        }

        #certificateCanvas {
            display: block;
            border-radius: 8px;
            background: #1a1a1a;
            width: 100%;
            height: auto;
            max-width: 900px;
            aspect-ratio: 1280 / 720;
            cursor: default;
        }

        .edit-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            padding: 6px 16px;
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            pointer-events: none;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .canvas-wrapper:hover .edit-hint {
            color: rgba(255, 255, 255, 0.7);
        }

        .panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 10px 14px;
            min-width: 300px;
            max-width: 500px;
            flex: 1;
            color: #e0e0e0;
            max-height: 85vh;
            overflow-y: auto;
        }

        .panel::-webkit-scrollbar {
            width: 4px;
        }

        .panel::-webkit-scrollbar-thumb {
            background: rgba(255, 215, 120, 0.3);
            border-radius: 4px;
        }

        .panel h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 14px;
            color: #ffd978;
            letter-spacing: 0.5px;
        }

        .panel-group {
            margin-bottom: 10px;
        }

        .panel-group label {
            display: block;
            font-size: 10px;
            font-weight: 500;
            color: #aaa;
            margin-bottom: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .panel-group input,
        .panel-group select {
            width: 100%;
            padding: 5px 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            transition: 0.2s;
            outline: none;
            font-family: inherit;
        }

        .panel-group input:focus,
        .panel-group select:focus {
            border-color: #ffd978;
            background: rgba(255, 215, 120, 0.05);
        }

        .panel-group input.highlight {
            border-color: #ffd978;
            box-shadow: 0 0 20px rgba(255, 215, 120, 0.15);
        }

        .panel-group select option {
            background: #1a1a1a;
            color: #fff;
        }

        .panel-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .panel-row .panel-group {
            flex: 1;
            margin-bottom: 0;
        }

        .panel-row .panel-group.small {
            flex: 0.6;
        }

        .panel-row .panel-group.tiny {
            flex: 0.4;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .color-picker-wrapper input[type="color"] {
            width: 32px;
            height: 28px;
            padding: 1px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            flex-shrink: 0;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 1px;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 3px;
        }

        .color-hex {
            font-size: 11px;
            color: #888;
            font-family: monospace;
            min-width: 50px;
        }

        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            color: #fff;
            flex: 1;
            min-width: 100px;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #b8860b, #ffd978);
            color: #111;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(184, 134, 11, 0.4);
        }

        .btn-success {
            background: #28a745;
        }

        .btn-success:hover {
            background: #34ce57;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #8a929b;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #e74c5e;
            transform: translateY(-2px);
        }

        .btn-info {
            background: #17a2b8;
        }

        .btn-info:hover {
            background: #1fc8e0;
            transform: translateY(-2px);
        }

        .btn-warning {
            background: #ffc107;
            color: #111;
        }

        .btn-warning:hover {
            background: #ffd044;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-upload {
            background: #2d7aff;
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            color: #fff;
            transition: 0.2s;
            flex: 1;
            text-align: center;
        }

        .btn-upload:hover {
            background: #4a8cff;
            transform: translateY(-2px);
        }

        .hint {
            font-size: 10px;
            color: #555;
            margin-top: 2px;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 28px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.92);
            color: #fff;
            font-weight: 500;
            opacity: 0;
            transition: 0.35s ease;
            z-index: 9999;
            pointer-events: none;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 13px;
        }

        .toast.show {
            opacity: 1;
        }

        .shortcuts {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 10px;
            color: #555;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .shortcuts kbd {
            background: rgba(255, 255, 255, 0.06);
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 10px;
            color: #888;
        }

        .template-selector {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .template-btn {
            padding: 4px 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            background: transparent;
            color: #888;
            font-size: 11px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
        }

        .template-btn:hover {
            border-color: rgba(255, 215, 120, 0.3);
            color: #fff;
        }

        .template-btn.active {
            border-color: #ffd978;
            color: #ffd978;
            background: rgba(255, 215, 120, 0.08);
        }

        .section-divider {
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            padding-top: 10px;
            margin-top: 6px;
        }

        .section-title {
            color: #ffd978;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .coord-input {
            width: 100%;
            padding: 5px 8px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            color: #fff;
            font-size: 12px;
            transition: 0.2s;
            outline: none;
            font-family: monospace;
        }

        .coord-input:focus {
            border-color: #ffd978;
            background: rgba(255, 215, 120, 0.05);
        }

        .element-label {
            font-size: 11px;
            color: #aaa;
            font-weight: 500;
            min-width: 30px;
        }

        /* UID 输入框左对齐（从左侧开始输入，向右延伸） */
        #userIdInput {
            text-align: left;
        }

        @media (max-width: 860px) {
            .container {
                flex-direction: column;
                align-items: center;
            }

            .panel {
                min-width: unset;
                max-width: unset;
                width: 100%;
                max-height: unset;
            }

            .canvas-wrapper {
                width: 100%;
            }

            #certificateCanvas {
                max-width: 100%;
            }

            .edit-hint {
                display: none;
            }

            .header {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }

            .header-actions {
                flex-wrap: wrap;
            }

            .panel-row {
                flex-wrap: wrap;
            }
        }

        @media (min-width: 1400px) {
            #certificateCanvas {
                max-width: 1000px;
            }
        }
    </style>
</head>

<body>
    <div id="toast" class="toast">✅ 操作成功</div>

    <!-- Header -->
    <div class="header">
        <h1>🎨 图片编辑</h1>
        <div class="header-actions">
            <button class="btn btn-info" id="saveTemplateBtn">💾 保存模板</button>
            <button class="btn btn-warning" id="loadTemplateBtn">
                📂 加载模板
            </button>
            <button class="btn btn-success" id="uploadBgHeaderBtn">
                🖼️ 上传背景
            </button>
            <button class="btn btn-danger" id="resetTemplateBtn">🔄 重置</button>
            <input type="file" id="templateFileInput" accept=".json" style="display: none" />
            <input type="file" id="bgInput" accept="image/*" style="display: none" />
        </div>
    </div>

    <div class="container">
        <!-- Canvas -->
        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="certificateCanvas" width="1280" height="720"></canvas>
        </div>

        <!-- 控制面板 -->
        <div class="panel">
            <h2>📐 模板编辑</h2>

            <!-- 模板选择 -->
            <div class="panel-group">
                <label>📁 模板</label>
                <div class="template-selector">
                    <button class="template-btn active" data-template="default">
                        默认
                    </button>
                </div>
            </div>

            <div class="panel-group">
                <label>👤 头像</label>
                <div class="btn-group">
                    <button class="btn-upload" id="uploadAvatarBtn">📷 上传头像</button>
                    <button class="btn btn-danger" id="resetAvatarBtn" style="flex: 0.3">
                        ✕
                    </button>
                </div>
                <input type="file" id="avatarInput" accept="image/*" style="display: none" />
            </div>

            <!-- ===== 文字样式调整 ===== -->
            <div class="section-divider">
                <div class="section-title">
                    ✏️ 文字编辑 (内容 · 位置 · 颜色 · 大小)
                </div>
            </div>

            <!-- ===== 用户ID ===== -->
            <div class="panel-group">
                <label>🆔 UID</label>
                <div class="panel-row">
                    <div class="panel-group" style="flex: 1.2">
                        <input type="text" id="userIdInput" value="8776843" data-key="userId" />
                    </div>
                    <div class="panel-group tiny">
                        <input type="number" class="coord-input" id="userIdX" value="880" placeholder="X" />
                    </div>
                    <div class="panel-group tiny">
                        <input type="number" class="coord-input" id="userIdY" value="248" placeholder="Y" />
                    </div>
                    <div class="panel-group tiny">
                        <div class="color-picker-wrapper">
                            <input type="color" id="userIdColor" value="#00b4d8" />
                            <span class="color-hex" id="userIdColorHex">#00b4d8</span>
                        </div>
                    </div>
                    <div class="panel-group tiny">
                        <input type="number" id="userIdSize" value="34" min="10" max="80" />
                    </div>
                </div>
            </div>

            <!-- ===== 等级 ===== -->
            <div class="panel-group">
                <label>📊 等级</label>
                <div class="panel-row">
                    <div class="panel-group" style="flex: 1.2">
                        <input type="text" id="levelInput" value="LV1" data-key="level" />
                    </div>
                    <div class="panel-group tiny">
                        <input type="number" class="coord-input" id="levelX" value="985" placeholder="X" />
                    </div>
                    <div class="panel-group tiny">
                        <input type="number" class="coord-input" id="levelY" value="296" placeholder="Y" />
                    </div>
                    <div class="panel-group tiny">
                        <div class="color-picker-wrapper">
                            <input type="color" id="levelColor" value="#00b4d8" />
                            <span class="color-hex" id="levelColorHex">#00b4d8</span>
                        </div>
                    </div>
                    <div class="panel-group tiny">
                        <input type="number" id="levelSize" value="34" min="10" max="80" />
                    </div>
                </div>
            </div>

            <!-- ===== 奖励金额 ===== -->
            <div class="panel-group">
                <label>💰 奖励金额</label>
                <div class="panel-row">
                    <div class="panel-group" style="flex: 1.2">
                        <input type="text" id="rewardInput" value="50" data-key="reward" />
                    </div>
                    <div class="panel-group tiny">
                        <input type="number" class="coord-input" id="rewardX" value="900" placeholder="X" />
                    </div>
                    <div class="panel-group tiny">
                        <input type="number" class="coord-input" id="rewardY" value="450" placeholder="Y" />
                    </div>
                    <div class="panel-group tiny">
                        <div class="color-picker-wrapper">
                            <input type="color" id="rewardColor" value="#00b4d8" />
                            <span class="color-hex" id="rewardColorHex">#00b4d8</span>
                        </div>
                    </div>
                    <div class="panel-group tiny">
                        <input type="number" id="rewardSize" value="80" min="10" max="80" />
                    </div>
                </div>
            </div>

            <div class="btn-group" style="margin-top: 8px">
                <button class="btn btn-success" id="exportPngBtn">💾 导出 PNG</button>
                <button class="btn btn-primary" id="copyImageBtn">📋 复制</button>
            </div>

            <div class="shortcuts">
                <span><kbd>Ctrl+S</kbd> 导出</span>
                <span><kbd>Ctrl+Shift+C</kbd> 复制</span>
                <span><kbd>双击</kbd> 编辑</span>
                <span><kbd>拖拽</kbd> 移动</span>
            </div>
        </div>
    </div>

    <script>
        (function () {
            "use strict";

            // ======================== 图片配置 ========================
            const BG_IMAGE_URL = "1.jpg";
            const DEFAULT_AVATAR_URL = "https://i.pravatar.cc/300?img=11";

            // ======================== 模板系统 ========================
            const TEMPLATES = {
                default: {
                    name: "默认",
                    bgImage: BG_IMAGE_URL,
                    elements: {
                        userId: { left: 920, top: 245, fontSize: 28, color: "#00b4d8", align: "left" },
                        level: { left: 985, top: 292, fontSize: 26, color: "#00b4d8", align: "center" },
                        reward: { left: 900, top: 450, fontSize: 30, color: "#00b4d8", align: "center" },
                    },
                },
            };

            // ======================== DOM ========================
            const canvasEl = document.getElementById("certificateCanvas");
            const canvasWrapper = document.getElementById("canvasWrapper");
            const toast = document.getElementById("toast");

            const userIdInput = document.getElementById("userIdInput");
            const levelInput = document.getElementById("levelInput");
            const rewardInput = document.getElementById("rewardInput");

            const userIdX = document.getElementById("userIdX");
            const userIdY = document.getElementById("userIdY");
            const levelX = document.getElementById("levelX");
            const levelY = document.getElementById("levelY");
            const rewardX = document.getElementById("rewardX");
            const rewardY = document.getElementById("rewardY");

            const userIdColor = document.getElementById("userIdColor");
            const levelColor = document.getElementById("levelColor");
            const rewardColor = document.getElementById("rewardColor");

            const userIdColorHex = document.getElementById("userIdColorHex");
            const levelColorHex = document.getElementById("levelColorHex");
            const rewardColorHex = document.getElementById("rewardColorHex");

            const userIdSize = document.getElementById("userIdSize");
            const levelSize = document.getElementById("levelSize");
            const rewardSize = document.getElementById("rewardSize");

            const avatarInput = document.getElementById("avatarInput");
            const uploadAvatarBtn = document.getElementById("uploadAvatarBtn");
            const resetAvatarBtn = document.getElementById("resetAvatarBtn");
            const bgInput = document.getElementById("bgInput");
            const uploadBgHeaderBtn = document.getElementById("uploadBgHeaderBtn");
            const exportPngBtn = document.getElementById("exportPngBtn");
            const copyImageBtn = document.getElementById("copyImageBtn");
            const saveTemplateBtn = document.getElementById("saveTemplateBtn");
            const loadTemplateBtn = document.getElementById("loadTemplateBtn");
            const resetTemplateBtn = document.getElementById("resetTemplateBtn");
            const templateFileInput = document.getElementById("templateFileInput");
            const templateBtns = document.querySelectorAll(".template-btn");

            let toastTimer;
            let currentTemplate = "default";
            let currentAvatarUrl = DEFAULT_AVATAR_URL;
            let currentBgUrl = BG_IMAGE_URL;

            const elementConfig = {
                userId: {
                    textInput: userIdInput,
                    xInput: userIdX,
                    yInput: userIdY,
                    colorInput: userIdColor,
                    sizeInput: userIdSize,
                    colorHex: userIdColorHex,
                    align: "left",
                },
                level: {
                    textInput: levelInput,
                    xInput: levelX,
                    yInput: levelY,
                    colorInput: levelColor,
                    sizeInput: levelSize,
                    colorHex: levelColorHex,
                    align: "center",
                },
                reward: {
                    textInput: rewardInput,
                    xInput: rewardX,
                    yInput: rewardY,
                    colorInput: rewardColor,
                    sizeInput: rewardSize,
                    colorHex: rewardColorHex,
                    align: "center",
                },
            };

            const objectKeys = {
                userId: userIdInput,
                level: levelInput,
                reward: rewardInput,
            };

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add("show");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
            }

            // ======================== 渐变蓝色生成函数 ========================
            function getBlueGradient() {
                return new fabric.Gradient({
                    type: "linear",
                    coords: { x1: 0, y1: 0, x2: 0, y2: 1 },
                    colorStops: [
                        { offset: 0, color: "#90e0ef" },
                        { offset: 0.3, color: "#00b4d8" },
                        { offset: 0.7, color: "#0077b6" },
                        { offset: 1, color: "#023e8a" },
                    ],
                });
            }

            // ======================== Fabric ========================
            let canvasWidth = 1280;
            let canvasHeight = 720;

            const canvas = new fabric.Canvas(canvasEl, {
                width: canvasWidth,
                height: canvasHeight,
                backgroundColor: "transparent",
                selection: false,
                renderOnAddRemove: true,
                preserveObjectStacking: true,
            });

            let objects = {
                bg: null,
                avatar: null,
                avatarBorder: null,
                avatarGlow: null,
                userId: null,
                level: null,
                reward: null,
            };

            // ======================== 自适应 ========================
            function fitCanvas() {
                const wrapperWidth = canvasWrapper.clientWidth - 24;
                const maxWidth = Math.min(wrapperWidth, 1000);
                const ratio = canvasWidth / canvasHeight;
                const displayWidth = Math.max(300, maxWidth);
                const displayHeight = displayWidth / ratio;

                canvasEl.style.width = displayWidth + "px";
                canvasEl.style.height = displayHeight + "px";
            }

            function scheduleFitCanvas(delay = 0) {
                if (delay > 0) {
                    setTimeout(() => {
                        requestAnimationFrame(fitCanvas);
                    }, delay);
                } else {
                    requestAnimationFrame(fitCanvas);
                }
            }

            let resizeObserver = null;

            function setupResizeObserver() {
                if (window.ResizeObserver) {
                    resizeObserver = new ResizeObserver(() => {
                        fitCanvas();
                    });
                    resizeObserver.observe(canvasWrapper);
                }
                window.addEventListener("resize", fitCanvas);
            }

            // ======================== 构建证书 ========================
            let isBuilding = false;

            function getTextStyle(color, fontSize, fontWeight = "600", align = "center") {
                const alignMap = {
                    left: { textAlign: "left", originX: "left" },
                    right: { textAlign: "right", originX: "right" },
                    center: { textAlign: "center", originX: "center" },
                };
                const alignment = alignMap[align] || alignMap.center;

                return {
                    fill: color,
                    fontSize: fontSize,
                    fontWeight: fontWeight,
                    fontFamily: "'Rajdhani', sans-serif",
                    textAlign: alignment.textAlign,
                    originX: alignment.originX,
                    originY: "center",
                    selectable: true,
                    evented: true,
                    cursor: "move",
                };
            }

            function buildCertificate(templateName) {
                if (isBuilding) return;
                isBuilding = true;

                const template = TEMPLATES[templateName] || TEMPLATES.default;
                updateTemplateFromUI(templateName);

                canvas.clear();

                buildTextLayers(template);

                const bgUrl = currentBgUrl || template.bgImage || "1.jpg";
                loadBackgroundWithFallback(bgUrl, template);

                buildAvatar(currentAvatarUrl, template);

                scheduleFitCanvas(50);
                scheduleFitCanvas(200);
                scheduleFitCanvas(500);

                setTimeout(() => {
                    isBuilding = false;
                }, 1000);
            }

            function loadBackgroundWithFallback(url, template) {
                fabric.Image.fromURL(
                    url,
                    (img) => {
                        if (img) {
                            const bgRatio = img.width / img.height;
                            const targetWidth = 1280;
                            const targetHeight = Math.round(targetWidth / bgRatio);

                            canvasWidth = targetWidth;
                            canvasHeight = targetHeight;
                            canvas.setWidth(canvasWidth);
                            canvas.setHeight(canvasHeight);
                            canvasEl.width = canvasWidth;
                            canvasEl.height = canvasHeight;

                            img.set({
                                left: 0,
                                top: 0,
                                scaleX: canvasWidth / img.width,
                                scaleY: canvasHeight / img.height,
                                selectable: false,
                                evented: false,
                                originX: "left",
                                originY: "top",
                                crossOrigin: "anonymous",
                            });
                            objects.bg = img;
                            canvas.add(img);
                            canvas.sendToBack(img);
                            canvas.renderAll();
                            scheduleFitCanvas();
                        } else {
                            useFallbackBackground(template);
                        }
                    }, { crossOrigin: "anonymous" }
                );
            }

            function useFallbackBackground(template) {
                const gradient = new fabric.Gradient({
                    type: "linear",
                    coords: { x1: 0, y1: 0, x2: 1, y2: 1 },
                    colorStops: [
                        { offset: 0, color: "#0a0a2e" },
                        { offset: 0.5, color: "#1a1040" },
                        { offset: 1, color: "#0d1b3e" },
                    ],
                });

                const bgRect = new fabric.Rect({
                    left: 0,
                    top: 0,
                    width: 1280,
                    height: 720,
                    fill: gradient,
                    selectable: false,
                    evented: false,
                    originX: "left",
                    originY: "top",
                });

                objects.bg = bgRect;
                canvas.add(bgRect);
                canvas.sendToBack(bgRect);
                canvas.renderAll();
                scheduleFitCanvas();
            }

            function buildTextLayers(template) {
                const elems = template.elements;

                const userIdVal = userIdInput.value || "8776843";
                const levelVal = levelInput.value || "LV1";
                const rewardVal = rewardInput.value || "50";

                const blueGradient = getBlueGradient();

                // UID - 左对齐（从920开始向右延伸）
                const userId = new fabric.Text(userIdVal, {
                    left: elems.userId.left,
                    top: elems.userId.top,
                    ...getTextStyle(blueGradient, elems.userId.fontSize, "700", "left"),
                    shadow: new fabric.Shadow({
                        color: "rgba(0,180,216,0.2)",
                        blur: 8,
                        offsetX: 1,
                        offsetY: 2,
                    }),
                });
                objects.userId = userId;
                canvas.add(userId);

                // 等级
                const level = new fabric.Text(levelVal, {
                    left: elems.level.left,
                    top: elems.level.top,
                    ...getTextStyle(blueGradient, elems.level.fontSize, "700", elems.level.align || "center"),
                    shadow: new fabric.Shadow({
                        color: "rgba(0,180,216,0.2)",
                        blur: 8,
                        offsetX: 1,
                        offsetY: 2,
                    }),
                });
                objects.level = level;
                canvas.add(level);

                // 奖励金额 (已去掉 USDT)
                const reward = new fabric.Text(rewardVal, {
                    left: elems.reward.left,
                    top: elems.reward.top,
                    ...getTextStyle(blueGradient, elems.reward.fontSize, "800", elems.reward.align || "center"),
                    shadow: new fabric.Shadow({
                        color: "rgba(0,180,216,0.25)",
                        blur: 10,
                        offsetX: 2,
                        offsetY: 4,
                    }),
                });
                objects.reward = reward;
                canvas.add(reward);

                enableDragging();
                canvas.renderAll();
            }

            // ======================== 头像构建 ========================
            function buildAvatar(url, template) {
                const canvasWidth = canvas.width || 1280;
                const canvasHeight = canvas.height || 720;

                const DESIGN_WIDTH = 1280;
                const DESIGN_HEIGHT = 720;

                // 头像位置和大小
                const AVATAR_LEFT = 322;
                const AVATAR_TOP = 386;
                const AVATAR_RADIUS = 170;

                const scaleX = canvasWidth / DESIGN_WIDTH;
                const scaleY = canvasHeight / DESIGN_HEIGHT;
                const scale = Math.min(scaleX, scaleY);

                const avatarRadius = AVATAR_RADIUS * scale;
                const centerX = AVATAR_LEFT * scaleX;
                const centerY = AVATAR_TOP * scaleY;

                if (objects.avatar) {
                    canvas.remove(objects.avatar);
                    objects.avatar = null;
                }
                if (objects.avatarBorder) {
                    canvas.remove(objects.avatarBorder);
                    objects.avatarBorder = null;
                }
                if (objects.avatarGlow) {
                    canvas.remove(objects.avatarGlow);
                    objects.avatarGlow = null;
                }

                fabric.Image.fromURL(
                    url,
                    (img) => {
                        if (img) {
                            const scaleXImg = (avatarRadius * 2) / img.width;
                            const scaleYImg = (avatarRadius * 2) / img.height;
                            const scale = Math.max(scaleXImg, scaleYImg);

                            const clipPath = new fabric.Circle({
                                radius: avatarRadius,
                                left: centerX - avatarRadius,
                                top: centerY - avatarRadius,
                                originX: "left",
                                originY: "top",
                                absolutePositioned: true,
                            });

                            const scaledWidth = img.width * scale;
                            const scaledHeight = img.height * scale;
                            const offsetX = (scaledWidth - avatarRadius * 2) / 2;
                            const offsetY = (scaledHeight - avatarRadius * 2) / 2;

                            img.set({
                                left: centerX - avatarRadius - offsetX,
                                top: centerY - avatarRadius - offsetY,
                                scaleX: scale,
                                scaleY: scale,
                                originX: "left",
                                originY: "top",
                                clipPath: clipPath,
                                selectable: false,
                                evented: false,
                                crossOrigin: "anonymous",
                            });

                            objects.avatar = img;
                            canvas.add(img);

                            const border = new fabric.Circle({
                                radius: avatarRadius + 3,
                                left: centerX,
                                top: centerY,
                                originX: "center",
                                originY: "center",
                                fill: "transparent",
                                stroke: "#FFD700",
                                strokeWidth: 3 * scale,
                                selectable: false,
                                evented: false,
                                shadow: new fabric.Shadow({
                                    color: "rgba(255,215,0,0.3)",
                                    blur: 20,
                                    offsetX: 0,
                                    offsetY: 0,
                                }),
                            });
                            objects.avatarBorder = border;
                            canvas.add(border);

                            const glow = new fabric.Circle({
                                radius: avatarRadius + 12,
                                left: centerX,
                                top: centerY,
                                originX: "center",
                                originY: "center",
                                fill: "transparent",
                                stroke: "rgba(255,215,0,0.15)",
                                strokeWidth: 3 * scale,
                                selectable: false,
                                evented: false,
                            });
                            objects.avatarGlow = glow;
                            canvas.add(glow);

                            if (objects.avatar) canvas.bringToFront(objects.avatar);
                            if (objects.avatarBorder) canvas.bringToFront(objects.avatarBorder);
                            if (objects.avatarGlow) canvas.bringToFront(objects.avatarGlow);

                            canvas.renderAll();
                        }
                    },
                    { crossOrigin: "anonymous" },
                );
            }

            // ======================== 启用拖拽 ========================
            function enableDragging() {
                const textObjects = [
                    objects.userId,
                    objects.level,
                    objects.reward,
                ].filter((obj) => obj);

                textObjects.forEach((obj) => {
                    obj.set({
                        selectable: true,
                        evented: true,
                        cursor: "move",
                    });
                });

                canvas.on("object:modified", function (e) {
                    const target = e.target;
                    if (target && target.type === "text") {
                        const key = getKeyForObject(target);
                        if (key) {
                            const config = elementConfig[key];
                            if (config) {
                                config.xInput.value = Math.round(target.left);
                                config.yInput.value = Math.round(target.top);
                                const template = TEMPLATES[currentTemplate];
                                if (template && template.elements[key]) {
                                    template.elements[key].left = Math.round(target.left);
                                    template.elements[key].top = Math.round(target.top);
                                }
                            }
                        }
                    }
                });

                canvas.on("mouse:dblclick", function (opt) {
                    const target = opt.target;
                    if (!target || target.type !== "text") {
                        clearHighlight();
                        return;
                    }

                    const input = getInputForObject(target);
                    if (input) {
                        highlightInput(input);
                        input.focus();
                        input.select();
                        showToast(`✏️ 正在编辑: "${input.value}"`);
                    }
                });
            }

            // ======================== 工具函数 ========================
            function getKeyForObject(obj) {
                for (const [key, storedObj] of Object.entries(objects)) {
                    if (storedObj === obj) {
                        return key;
                    }
                }
                return null;
            }

            function getInputForObject(obj) {
                for (const [key, storedObj] of Object.entries(objects)) {
                    if (storedObj === obj) {
                        return objectKeys[key];
                    }
                }
                return null;
            }

            function highlightInput(input) {
                if (!input) return;
                document.querySelectorAll(".panel-group input").forEach((el) => {
                    el.classList.remove("highlight");
                });
                input.classList.add("highlight");
                input.scrollIntoView({ behavior: "smooth", block: "center" });
            }

            function clearHighlight() {
                document.querySelectorAll(".panel-group input").forEach((el) => {
                    el.classList.remove("highlight");
                });
            }

            function updateTemplateFromUI(templateName) {
                const template = TEMPLATES[templateName];
                if (!template) return;

                const keys = ["userId", "level", "reward"];
                keys.forEach((key) => {
                    if (template.elements[key]) {
                        const config = elementConfig[key];
                        if (config) {
                            const x = parseFloat(config.xInput.value) || template.elements[key].left;
                            const y = parseFloat(config.yInput.value) || template.elements[key].top;
                            const color = config.colorInput.value;
                            const size = parseInt(config.sizeInput.value) || template.elements[key].fontSize;

                            template.elements[key].left = x;
                            template.elements[key].top = y;
                            template.elements[key].color = color;
                            template.elements[key].fontSize = size;

                            if (config.colorHex) {
                                config.colorHex.textContent = color;
                            }
                        }
                    }
                });
            }

            // ======================== 更新文字 ========================
            function updateText(objectKey, value) {
                const obj = objects[objectKey];
                if (obj && obj.type === "text") {
                    obj.set("text", value || " ");
                    canvas.renderAll();
                }
            }

            userIdInput.addEventListener("input", () => updateText("userId", userIdInput.value));
            levelInput.addEventListener("input", () => updateText("level", levelInput.value));
            rewardInput.addEventListener("input", () => updateText("reward", rewardInput.value));

            // ======================== 更新样式 ========================
            function updateTextStyle(key) {
                const obj = objects[key];
                if (!obj || obj.type !== "text") return;

                const config = elementConfig[key];
                if (!config) return;

                const x = parseFloat(config.xInput.value) || obj.left;
                const y = parseFloat(config.yInput.value) || obj.top;
                const size = parseInt(config.sizeInput.value) || obj.fontSize;

                const blueGradient = getBlueGradient();

                obj.set({
                    left: x,
                    top: y,
                    fill: blueGradient,
                    fontSize: size,
                });

                const template = TEMPLATES[currentTemplate];
                if (template && template.elements[key]) {
                    template.elements[key].left = x;
                    template.elements[key].top = y;
                    template.elements[key].color = "#00b4d8";
                    template.elements[key].fontSize = size;
                }

                canvas.renderAll();
            }

            Object.keys(elementConfig).forEach((key) => {
                const config = elementConfig[key];
                config.xInput.addEventListener("input", () => updateTextStyle(key));
                config.yInput.addEventListener("input", () => updateTextStyle(key));
                config.sizeInput.addEventListener("input", () => updateTextStyle(key));

                if (config.colorHex) {
                    config.colorHex.textContent = config.colorInput.value;
                }
            });

            document.querySelectorAll(".panel-group input").forEach((input) => {
                input.addEventListener("focus", function () {
                    highlightInput(this);
                });
                input.addEventListener("blur", function () {
                    setTimeout(() => {
                        if (document.activeElement?.tagName !== "INPUT") {
                            clearHighlight();
                        }
                    }, 200);
                });
                input.addEventListener("keydown", function (e) {
                    if (e.key === "Enter") {
                        this.blur();
                        clearHighlight();
                    }
                });
            });

            canvas.on("mouse:down", function (opt) {
                if (!opt.target) {
                    clearHighlight();
                }
            });

            // ======================== 头像上传 ========================
            uploadAvatarBtn.addEventListener("click", () => avatarInput.click());

            avatarInput.addEventListener("change", function (e) {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith("image/")) {
                    showToast("⚠️ 请上传图片");
                    return;
                }
                const reader = new FileReader();
                reader.onload = function (ev) {
                    const dataUrl = ev.target.result;
                    currentAvatarUrl = dataUrl;
                    const template = TEMPLATES[currentTemplate] || TEMPLATES.default;
                    buildAvatar(dataUrl, template);
                    showToast("✅ 头像更新成功");
                };
                reader.readAsDataURL(file);
                this.value = "";
            });

            resetAvatarBtn.addEventListener("click", () => {
                currentAvatarUrl = DEFAULT_AVATAR_URL;
                const template = TEMPLATES[currentTemplate] || TEMPLATES.default;
                buildAvatar(currentAvatarUrl, template);
                showToast("🔄 已重置头像");
            });

            // ======================== 背景上传 ========================
            uploadBgHeaderBtn.addEventListener("click", () => bgInput.click());

            bgInput.addEventListener("change", function (e) {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith("image/")) {
                    showToast("⚠️ 请上传图片");
                    return;
                }
                const reader = new FileReader();
                reader.onload = function (ev) {
                    const dataUrl = ev.target.result;
                    currentBgUrl = dataUrl;
                    buildCertificate(currentTemplate);
                    showToast("✅ 背景图片更新成功");
                };
                reader.readAsDataURL(file);
                this.value = "";
            });

            // ======================== 模板切换 ========================
            templateBtns.forEach((btn) => {
                btn.addEventListener("click", function () {
                    templateBtns.forEach((b) => b.classList.remove("active"));
                    this.classList.add("active");

                        const keys = ["userId", "level", "reward"];
                        keys.forEach((key) => {
                            const elem = template.elements[key];
                            if (elem) {
                                const config = elementConfig[key];
                                if (config) {
                                    config.xInput.value = elem.left;
                                    config.yInput.value = elem.top;
                                    config.colorInput.value = elem.color;
                                    config.sizeInput.value = elem.fontSize;
                                    if (config.colorHex) {
                                        config.colorHex.textContent = elem.color;
                                    }
                                }
                            }
                        });
                    }

                    buildCertificate(currentTemplate);
                    showToast(`📁 切换到: ${TEMPLATES[currentTemplate].name}`);
                });
            });

            // ======================== 保存模板 ========================
            saveTemplateBtn.addEventListener("click", function () {
                try {
                    updateTemplateFromUI(currentTemplate);

                    const positions = {};
                    const textKeys = ["userId", "level", "reward"];

                    textKeys.forEach((key) => {
                        const obj = objects[key];
                        if (obj && obj.type === "text") {
                            positions[key] = {
                                left: Math.round(obj.left),
                                top: Math.round(obj.top),
                                fontSize: obj.fontSize,
                                color: "#00b4d8",
                                align: obj.textAlign || "center",
                            };
                        }
                    });

                    const template = {
                        name: "自定义模板",
                        bgImage: "1.jpg",
                        elements: positions,
                        createdAt: new Date().toISOString(),
                    };

                    const blob = new Blob([JSON.stringify(template, null, 2)], {
                        type: "application/json",
                    });
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement("a");
                    link.download = `certificate_template_${Date.now()}.json`;
                    link.href = url;
                    link.click();
                    URL.revokeObjectURL(url);

                    showToast("✅ 模板已保存");

                    showToast("⚠️ 保存失败: " + err.message);
                }
            });

            // ======================== 加载模板 ========================
            loadTemplateBtn.addEventListener("click", () => templateFileInput.click());

            templateFileInput.addEventListener("change", function (e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();

                    try {

                            showToast("⚠️ 无效的模板文件");
                            return;
                        }

                        TEMPLATES["custom"] = template;
                        currentTemplate = "custom";

                        const keys = ["userId", "level", "reward"];
                        keys.forEach((key) => {
                            const elem = template.elements[key];
                            if (elem) {
                                const config = elementConfig[key];
                                if (config) {
                                    config.xInput.value = elem.left;
                                    config.yInput.value = elem.top;
                                    config.colorInput.value = elem.color || "#00b4d8";
                                    config.sizeInput.value = elem.fontSize;
                                    if (config.colorHex) {
                                        config.colorHex.textContent = config.colorInput.value;
                                    }
                                }
                            }
                        });

                        const container = document.querySelector(".template-selector");
                        const customBtn = document.createElement("button");
                        customBtn.className = "template-btn active";
                        customBtn.dataset.template = "custom";
                        customBtn.textContent = "📂 自定义";
                        document
                            .querySelectorAll(".template-btn")
                            .forEach((b) => b.classList.remove("active"));
                        const existing = container.querySelector(

                        );

                            existing.remove();

                        container.appendChild(customBtn);
                        customBtn.addEventListener("click", function () {
                            document
                                .querySelectorAll(".template-btn")
                                .forEach((b) => b.classList.remove("active"));
                            this.classList.add("active");
                            currentTemplate = "custom";
                            buildCertificate("custom");
                            showToast("📁 加载自定义模板");
                        });

                        buildCertificate("custom");
                        showToast("✅ 模板加载成功");
                    } catch (err) {
                        showToast("⚠️ 模板解析失败: " + err.message);
                    }
                };
                reader.readAsText(file);
                this.value = "";
            });

            // ======================== 重置模板 ========================
            resetTemplateBtn.addEventListener("click", function () {
                if (confirm("确定要重置为默认模板吗？")) {
                    currentTemplate = "default";
                    document.querySelectorAll(".template-btn").forEach((b) => {
                        b.classList.remove("active");
                        if (b.dataset.template === "default") b.classList.add("active");
                    });
                    const customBtn = document.querySelector(
                        '[data-template="custom"]'
                    );
                    if (customBtn) customBtn.remove();
                    delete TEMPLATES["custom"];

                    userIdInput.value = "8776843";
                    levelInput.value = "LV1";
                    rewardInput.value = "50";

                    const defaultTemplate = TEMPLATES.default;
                    const keys = ["userId", "level", "reward"];
                    keys.forEach((key) => {
                        const elem = defaultTemplate.elements[key];
                        if (elem) {
                            const config = elementConfig[key];
                            if (config) {
                                config.xInput.value = elem.left;
                                config.yInput.value = elem.top;
                                config.colorInput.value = elem.color;
                                config.sizeInput.value = elem.fontSize;
                                if (config.colorHex) {
                                    config.colorHex.textContent = elem.color;
                                }
                            }
                        }
                    });

                    currentAvatarUrl = DEFAULT_AVATAR_URL;
                    currentBgUrl = "1.jpg";
                    buildCertificate("default");
                    showToast("🔄 已重置");
                }
            });

            // ======================== 导出和复制（修复黑边问题） ========================
            function getExportCanvas(multiplier = 2) {
                return new Promise((resolve) => {
                    canvas.renderAll();
                    setTimeout(() => {
                        // 获取当前背景图的实际尺寸
                        const exportWidth = canvasWidth;
                        const exportHeight = canvasHeight;

                        // 创建一个临时的离屏canvas用于导出
                        const tempCanvas = document.createElement('canvas');
                        tempCanvas.width = exportWidth * multiplier;
                        tempCanvas.height = exportHeight * multiplier;
                        const tempCtx = tempCanvas.getContext('2d');

                        // 如果背景是图片，先绘制背景
                        if (objects.bg && objects.bg.type === 'image') {
                            const bgImg = objects.bg;
                            // 获取原始图片数据
                            const originalSrc = bgImg.getSrc();
                            const img = new Image();
                            img.crossOrigin = 'anonymous';
                            img.onload = function () {
                                // 绘制背景图片
                                tempCtx.drawImage(img, 0, 0, tempCanvas.width, tempCanvas.height);
                                // 然后绘制所有其他对象
                                canvas.renderAll();
                                const dataUrl = canvas.toDataURL({
                                    format: 'png',
                                    quality: 1,
                                    multiplier: multiplier,
                                    width: exportWidth,
                                    height: exportHeight
                                });
                                resolve(dataUrl);
                            };
                            img.onerror = function () {
                                // 如果图片加载失败，使用canvas默认导出
                                const dataUrl = canvas.toDataURL({
                                    format: 'png',
                                    quality: 1,
                                    multiplier: multiplier,
                                    width: exportWidth,
                                    height: exportHeight
                                });
                                resolve(dataUrl);
                            };
                            // 尝试获取图片src
                            try {
                                img.src = originalSrc;
                            } catch (e) {
                                const dataUrl = canvas.toDataURL({
                                    format: 'png',
                                    quality: 1,
                                    multiplier: multiplier,
                                    width: exportWidth,
                                    height: exportHeight
                                });
                                resolve(dataUrl);
                            }
                        } else {
                            // 没有背景图片或背景不是图片，直接导出
                            const dataUrl = canvas.toDataURL({
                                format: 'png',
                                quality: 1,
                                multiplier: multiplier,
                                width: exportWidth,
                                height: exportHeight
                            });
                            resolve(dataUrl);
                        }
                    }, 150);
                });
            }

            // 简化版导出 - 直接使用canvas导出，但确保背景正确
            function getSimpleExportCanvas(multiplier = 2) {
                return new Promise((resolve) => {
                    canvas.renderAll();
                    setTimeout(() => {
                        const dataUrl = canvas.toDataURL({
                            format: 'png',
                            quality: 1,
                            multiplier: multiplier,
                        });
                        resolve(dataUrl);
                    }, 150);
                });
            }

            exportPngBtn.addEventListener("click", async function () {
                const oldText = this.textContent;
                this.textContent = "⏳ 生成中...";
                this.disabled = true;
                try {
                    const dataUrl = await getSimpleExportCanvas(2);
                    const link = document.createElement("a");
                    link.download = "Certificate_1280x720.png";
                    link.href = dataUrl;
                    link.click();
                    showToast("✅ 导出成功");
                } catch (err) {
                    showToast("⚠️ 导出失败: " + err.message);
                } finally {
                    this.textContent = oldText;
                    this.disabled = false;
                }
            });

            copyImageBtn.addEventListener("click", async function () {
                const oldText = this.textContent;
                this.textContent = "⏳ 生成中...";
                this.disabled = true;
                try {
                    // 使用简单导出方式，保证背景完整
                    canvas.renderAll();
                    await new Promise(resolve => setTimeout(resolve, 100));

                    const dataUrl = canvas.toDataURL({
                        format: 'png',
                        quality: 1,
                        multiplier: 2,
                    });

                    const res = await fetch(dataUrl);
                    const blob = await res.blob();
                    await navigator.clipboard.write([
                        new ClipboardItem({ [blob.type]: blob }),
                    ]);
                    showToast("✅ 已复制到剪贴板");
                    this.textContent = "✅ 已复制";
                    setTimeout(() => {
                        this.textContent = oldText;
                    }, 1500);
                } catch (err) {
                    showToast("⚠️ 复制失败: " + err.message);
                    this.textContent = oldText;
                } finally {
                    this.disabled = false;
                }
            });

            // ======================== 快捷键 ========================
            document.addEventListener("keydown", (e) => {
                if (e.ctrlKey && e.key.toLowerCase() === "s") {
                    e.preventDefault();
                    exportPngBtn.click();
                }
                if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "c") {
                    e.preventDefault();
                    copyImageBtn.click();
                }
                if (e.key === "Escape") {
                    clearHighlight();
                    document.activeElement?.blur();
                }
            });

            // ======================== 启动 ========================
            function init() {
                buildCertificate("default");

                setTimeout(() => {
                    requestAnimationFrame(fitCanvas);
                }, 100);
                setTimeout(() => {
                    requestAnimationFrame(fitCanvas);
                }, 300);
                setTimeout(() => {
                    requestAnimationFrame(fitCanvas);
                }, 600);
                setTimeout(() => {
                    requestAnimationFrame(fitCanvas);
                }, 1000);

                setupResizeObserver();
                console.log("🎨 Certificate Editor ready! (1280x720)");
            }

            if (document.readyState === "complete") {
                init();
            } else {
                window.addEventListener("load", init);
            }

            window.addEventListener("pageshow", function () {
                setTimeout(fitCanvas, 200);
            });

        })();
    </script>
</body>

</html>
